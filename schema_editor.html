<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1114" id="themeMetaColor">
  <title>ED Doc - Template Editor</title>
  <link rel="icon" type="image/png" href="./assets/icon-192.png">
  <style>
    @font-face {
      font-family: "Hanken Grotesk";
      src: url("./assets/fonts/hanken-grotesk-latin-wght-normal.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* Same tokens as the Case Board in index.html. */
    html[data-theme="dark"], html:not([data-theme]) {
      color-scheme: dark;
      --bg: #0f1114;
      --panel: #171a1e;
      --panel-2: #20242a;
      --panel-3: #2a2f36;
      --field: #1b1f24;
      --text: #f4f6f8;
      --text-2: #c7cdd5;
      --muted: #adb4bd;
      --border: #252a30;
      --border-strong: #49515b;
      --accent: #86b5f7;
      --accent-soft: #1a2a42;
      --accent-ink: #0f1114;
      --danger: #f0716a;
      --elev: 0 12px 32px rgba(0, 0, 0, .45);
      --sheet-shadow: 0 -10px 30px rgba(0, 0, 0, .40);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f1f3f6;
      --panel: #ffffff;
      --panel-2: #f3f5f8;
      --panel-3: #e6e9ee;
      --field: #ffffff;
      --text: #0d0f12;
      --text-2: #3a424c;
      --muted: #5a626c;
      --border: #e1e5ea;
      --border-strong: #cbd1d9;
      --accent: #1d5fbf;
      --accent-soft: #e2ecfa;
      --accent-ink: #ffffff;
      --danger: #c8372f;
      --elev: 0 12px 32px rgba(13, 15, 18, .10);
      --sheet-shadow: 0 -10px 30px rgba(0, 0, 0, .10);
    }
    :root {
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --sheet-peek: calc(60px + var(--safe-bottom));
      --sheet-h: min(70vh, 620px);
      --board-gutter: 24px;
      --ease-out: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(var(--sheet-peek) + 24px);
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }
    body.note-open { padding-bottom: calc(var(--sheet-h) + 24px); }

    /* ---------- Header ---------- */
    body > header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px var(--board-gutter);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .cb-brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
    h1 { display: flex; align-items: center; gap: 8px; flex: none; font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
    .cb-mark { color: var(--accent); flex: none; }
    .cb-context { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .button-row { flex: none; flex-wrap: nowrap; gap: 2px; margin: 0; }
    header button { border-color: transparent; white-space: nowrap; }

    /* ---------- Header: everyday actions in front, the rest under More (as in ED Doc) ---------- */
    .btn-icon { flex: none; transition: transform .2s var(--ease-out); }
    .forms-menu { position: relative; }
    .forms-menu-list {
      display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 50;
      min-width: 190px; padding: 4px; flex-direction: column; gap: 2px;
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
      box-shadow: var(--elev);
    }
    .forms-menu.open .forms-menu-list { display: flex; }
    .forms-menu-list button {
      justify-content: flex-start; width: 100%; min-height: 36px;
      padding: 9px 12px; border: 0; color: var(--text-2); text-align: left;
    }
    .forms-menu.open .forms-menu-btn .btn-icon { transform: rotate(180deg); }
    .header-more .header-reset {
      margin-top: 4px;
      color: var(--danger);
      border-top: 1px solid var(--border);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    }
    /* Day/Night is a small icon toggle; its words stay for screen readers. */
    header .btn-theme-toggle { width: 36px; height: 36px; padding: 0; justify-content: center; flex: none; }
    header .btn-theme-toggle > span {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* ---------- Buttons ---------- */
    .button-row { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      font: inherit;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: -.01em;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s var(--ease-out);
    }
    button:hover { background: var(--panel-2); color: var(--text); border-color: var(--border-strong); }
    button:active { transform: scale(.97); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }
    button.btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    button.btn-primary:hover { background: var(--text-2); border-color: var(--text-2); color: var(--bg); }
    button.btn-primary:disabled { background: var(--text); border-color: var(--text); }

    /* ---------- Fields ---------- */
    input[type="text"], input[type="search"], select, textarea {
      width: 100%;
      font: inherit;
      font-size: 14.5px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background-color: var(--field);
      color: var(--text);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: .55; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    @media (pointer: coarse) {
      input, select, textarea { font-size: 16px !important; }
    }
    [hidden] { display: none !important; }
    /* Labels lead their boxes: larger, bold and brighter than the placeholder text (as in ED Doc). */
    label { display: block; font-size: 14px; font-weight: 600; color: var(--text-2); margin: 12px 0 4px; }

    /* ---------- Toolbar ---------- */
    .te-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 1480px;
      margin: 0 auto;
      padding: 16px var(--board-gutter) 0;
    }
    .te-search { flex: 1 1 320px; max-width: 480px; min-width: 0; }
    .te-segments { display: flex; flex: none; gap: 2px; }
    .te-segments button { border-color: transparent; }
    .te-segments button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    /* The filter highlight slides to the new choice (see teInitFilterPill). */
    .te-segments { position: relative; }
    .te-segments > button { position: relative; z-index: 1; }
    .te-pill { position: absolute; z-index: 0; pointer-events: none; border-radius: var(--radius-sm); background: var(--accent-soft); }
    .te-pill-moving > button[aria-pressed="true"] { background: transparent; }
    .te-counts { margin-left: auto; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ---------- Board ---------- */
    #main-sections {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px var(--board-gutter) 16px;
    }
    .main-section {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: border-color .2s ease;
    }
    .main-section:hover { border-color: var(--border-strong); }
    .main-section.is-expanded { grid-column: 1 / -1; border-color: var(--border-strong); }
    /* Tiles sit above the shell a closing card leaves behind (see teCloseGhost). */
    #main-sections .main-section { position: relative; z-index: 1; }
    #main-sections .main-section.is-expanded { z-index: 2; }
    .te-ghost {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
    }

    .main-collapsible {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: flex-start;
      gap: 0 8px;
      width: 100%;
      min-height: 104px;
      padding: 14px 16px;
      border: 0;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      line-height: 24px;
      letter-spacing: 0;
      text-align: left;
    }
    .main-collapsible:hover { background: transparent; }
    .main-collapsible:active { transform: none; }
    .main-collapsible.active { min-height: 0; }
    .main-collapsible > .te-title { flex: 1; min-width: 0; }
    .te-count { flex: none; font-size: 12.5px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
    .arrow { display: inline-flex; flex: none; opacity: .45; transition: transform .2s var(--ease-out); }
    .main-collapsible.active .arrow, .collapsible.active .arrow { transform: rotate(90deg); }

    .cb-summary {
      flex: 0 0 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 6px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      color: var(--muted);
    }
    .cb-summary b { font-weight: 500; color: var(--accent); }
    .main-collapsible.active .cb-summary { display: none; }

    .cb-status { display: inline-flex; flex: none; width: 16px; height: 16px; }
    .cb-status svg { width: 16px; height: 16px; fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
    .cb-status .dot { fill: var(--accent); stroke: none; opacity: 0; transform: scale(.4); transform-origin: 8px 8px; transition: opacity .18s ease, transform .22s var(--ease-out); }
    .cb-status.is-draft .dot { opacity: 1; transform: none; }

    .main-content { padding: 0 16px 16px; }

    /* Sub-sections sit side by side; the open one takes the full row. */
    .te-subs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-flow: dense;
      gap: 6px;
      align-items: start;
    }
    .section { min-width: 0; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .section.is-open { grid-column: 1 / -1; }
    .collapsible {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 4px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
    }
    .collapsible:hover { background: transparent; }
    .collapsible:active { transform: none; }
    .collapsible.active { color: var(--accent); }
    .collapsible > .te-title { flex: 1; min-width: 0; }
    .section .cb-status, .section .cb-status svg { width: 14px; height: 14px; }
    .section .te-grid { padding: 4px 4px 12px; }

    .te-group-title { margin: 16px 0 8px; font-size: 13.5px; font-weight: 500; color: var(--text); }
    .te-group-title:first-child { margin-top: 0; }

    /* ---------- Parameters: drawn the way the form draws them ---------- */
    .te-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      align-items: stretch;
    }
    /* Each parameter (name + its buttons) sits in its own panel, one step lighter than the card, as in ED Doc. */
    .te-field {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px;
      background: var(--panel-2);
      border: 1px solid var(--panel-3);
      border-radius: var(--radius-md);
    }
    /* Buttons keep a visible outline on the lighter panel. */
    .te-field button.chip-tag:not(:hover) { background: var(--field); border-color: var(--border-strong); }
    .te-field.is-wide { grid-column: 1 / -1; }
    .te-field-top { display: flex; align-items: center; gap: 4px; min-height: 28px; }
    input[type="text"].te-name {
      flex: 1;
      min-width: 0;
      padding: 3px 6px;
      margin-left: -7px;
      border-color: transparent;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
    }
    input[type="text"].te-name:hover { border-color: var(--border); }
    input[type="text"].te-name:focus { border-color: var(--accent); background: var(--field); }
    .te-mark { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: none; }
    .te-field.is-modified .te-mark { display: block; }
    .te-action { padding: 4px 6px; border-color: transparent; color: var(--muted); font-size: 12px; }
    .te-action[hidden] { display: none; }
    .te-action.is-danger:hover { color: var(--danger); background: transparent; border-color: var(--danger); }

    .chip-container { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    button.chip-tag {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0 6px;
      max-width: 100%;
      padding: 4px 11px;
      color: var(--text-2);
      font-size: 12.5px;
      line-height: 20px;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .te-chip-out { color: var(--accent); font-weight: 400; }

    /* Up / down: big enough to tap on a phone. */
    button.te-icon {
      flex: none;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border-color: transparent;
      color: var(--muted);
    }
    @media (pointer: coarse) {
      button.te-icon { width: 36px; height: 36px; }
    }

    .te-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .te-seg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .te-seg button { padding: 3px 10px; border-color: transparent; font-size: 12px; }
    .te-seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

    /* Submenu wording and order, above its parameters. */
    .te-sub-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0 0 16px;
      padding: 4px 0 14px;
      border-bottom: 1px solid var(--border);
    }
    .te-sub-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0 12px; }
    .te-sub-input { margin: 4px 0 0; }
    .te-sub-input span { display: block; margin-bottom: 4px; }
    .te-sub-input input[type="text"] { padding: 6px 10px; font-size: 13px; }
    .te-sub-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .te-sub-actions:empty { display: none; }
    .te-sub-body { padding: 4px 4px 12px; }
    .te-empty-sub { color: var(--muted); font-size: 12.5px; }

    button.te-add {
      justify-content: center;
      width: 100%;
      margin-top: 16px;
      border-style: dashed;
      border-color: var(--border-strong);
      color: var(--text-2);
    }
    .te-subs > button.te-add { grid-column: 1 / -1; margin-top: 0; }

    .te-preview { margin-top: 16px; padding: 10px 12px; background: var(--panel-2); border-radius: var(--radius-sm); }
    .te-preview-title { font-size: 12px; font-weight: 600; color: var(--text-2); }
    .te-preview-title span { font-weight: 400; color: var(--muted); }
    .te-preview pre {
      margin-top: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 18px;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    input[type="text"].te-chip-add {
      flex: 0 1 132px;
      width: 132px;
      padding: 5px 10px;
      border-style: dashed;
      border-color: var(--border-strong);
      background: transparent;
      font-size: 12.5px;
    }
    input[type="text"].te-chip-add:focus { flex-basis: 240px; border-style: solid; }

    .te-note { display: flex; align-items: center; gap: 8px; margin: 0; white-space: nowrap; }
    input[type="text"].te-prefix { flex: 1; min-width: 0; padding: 5px 10px; font-size: 12.5px; }

    .te-field-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .code-id {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--muted);
    }
    select.te-move {
      flex: none;
      width: auto;
      max-width: 60%;
      padding: 2px 4px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    select.te-move:hover { border-color: var(--border); }

    .te-empty { grid-column: 1 / -1; padding: 48px 16px; text-align: center; color: var(--muted); }

    /* ---------- Changes sheet (the note sheet's twin) ---------- */
    .output-container {
      position: fixed;
      z-index: 30;
      left: max(var(--board-gutter), calc((100vw - 1432px) / 2));
      right: max(var(--board-gutter), calc((100vw - 1432px) / 2));
      bottom: 0;
      height: var(--sheet-h);
      display: flex;
      flex-direction: column;
      padding: 0 12px 12px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      box-shadow: var(--sheet-shadow);
      transform: translateY(calc(100% - var(--sheet-peek)));
      transition: transform .34s var(--ease-out);
    }
    body.note-open .output-container { transform: none; }
    #docHeaderRow { flex: none; height: calc(var(--sheet-peek) - var(--safe-bottom)); }
    #noteToggle {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0;
      text-align: left;
    }
    #noteToggle:active { transform: none; }
    .cb-note-title { flex: none; }
    #noteStatus { min-width: 0; font-size: 14px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cb-note-chev { flex: none; margin-left: auto; color: var(--muted); transition: transform .3s var(--ease-out); }
    body.note-open .cb-note-chev { transform: rotate(180deg); }
    textarea#diffOutput {
      flex: 1;
      min-height: 0;
      resize: none;
      font-size: 14px;
      line-height: 22px;
    }
    .output-container .button-row { flex: none; margin-top: 10px; }

    /* ---------- Dialog ---------- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(10, 10, 12, .55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .modal-backdrop.active { display: flex; }
    @keyframes cb-dialog-in {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: none; }
    }
    .modal-dialog {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--elev);
      animation: cb-dialog-in .22s var(--ease-out);
    }
    .modal-header { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; }
    .modal-body { padding: 8px 20px 20px; overflow-y: auto; }
    .modal-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-error { margin-top: 12px; color: var(--danger); font-size: 12.5px; }
    .modal-error:empty { display: none; }
    .modal-hint { margin-top: 4px; color: var(--muted); font-size: 12px; }
    textarea#addLines { min-height: 150px; resize: vertical; font-size: 14px; line-height: 22px; }
    .modal-check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--text-2); font-size: 13px; }
    .modal-check input { width: 18px; height: 18px; accent-color: var(--accent); }
    .modal-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
    .modal-row .is-danger { margin-left: auto; color: var(--danger); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 6px; padding: 12px 20px; border-top: 1px solid var(--border); }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      right: 24px;
      bottom: calc(var(--sheet-peek) + 16px);
      z-index: 2000;
      padding: 9px 18px;
      background: var(--text);
      color: var(--bg);
      border-radius: 999px;
      box-shadow: var(--elev);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s var(--ease-out);
    }
    .toast.show { opacity: 1; transform: none; }

    /* ---------- Tablet and phone ---------- */
    @media (max-width: 1180px) {
      #main-sections { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 860px) {
      body > header { flex-wrap: wrap; }
      header .button-row { flex: 1 1 100%; flex-wrap: wrap; }
      .te-toolbar { flex-wrap: wrap; }
      .te-search { flex: 1 1 100%; max-width: none; }
    }
    @media (max-width: 768px) {
      :root { --board-gutter: 12px; --sheet-h: 78vh; }
      body > header { position: static; }
      #main-sections { grid-template-columns: minmax(0, 1fr); }
      .main-collapsible { min-height: 0; }
      /* Board: one compact row per section, as in ED Doc. */
      #main-sections { gap: 8px; }
      .main-collapsible { padding: 11px 14px; row-gap: 2px; }
      .main-collapsible .cb-summary { margin-top: 2px; -webkit-line-clamp: 1; font-size: 13px; }
      .output-container { left: 6px; right: 6px; padding: 0 10px 10px 14px; }
      .toast { right: 12px; }
    }
    /* ---------- Wide screens: the Changes sheet docks beside the board (as ED Doc's note) ----------
       Same width threshold as the 4-column board; below it the bottom sheet stays.
       --header-h is kept in step with the sticky header by schema-editor.js. */
    @media screen and (min-width: 1181px) {
      :root { --dock-w: clamp(360px, 30vw, 520px); }
      body, body.note-open { padding-bottom: 24px; }
      .te-toolbar,
      #main-sections {
        max-width: none;
        margin: 0;
        padding-right: calc(var(--dock-w) + 2 * var(--board-gutter));
      }
      #main-sections { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
      .output-container,
      body.note-open .output-container {
        left: auto;
        right: var(--board-gutter);
        top: calc(var(--header-h, 54px) + 16px);
        bottom: 16px;
        width: var(--dock-w);
        height: auto;
        padding: 0 16px 16px 20px;
        border-bottom: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: none;
        transform: none;
        transition: none;
      }
      #noteToggle { cursor: default; }
      .cb-note-chev { display: none; }
      .toast { bottom: 24px; right: calc(var(--dock-w) + 2 * var(--board-gutter)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    /* ---------- Installed app: clear the notch and home indicator ---------- */
    @media screen {
      body { padding-left: var(--safe-left); padding-right: var(--safe-right); }
      body > header { padding-top: calc(10px + var(--safe-top)); }
      .output-container {
        margin-left: var(--safe-left);
        margin-right: var(--safe-right);
        padding-bottom: calc(12px + var(--safe-bottom));
      }
      .modal-backdrop {
        padding-top: calc(20px + var(--safe-top));
        padding-bottom: calc(20px + var(--safe-bottom));
      }
    }
  </style>
  <script src="./assets/js/00-theme-init.js"></script>
</head>

<body>
  <header>
    <div class="cb-brand">
      <h1><svg class="cb-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13h5l2.5-7 4.5 13 2.5-6H22"/></svg>ED Doc</h1>
      <span class="cb-context">Template Editor</span>
    </div>
    <div class="button-row">
      <button type="button" data-on-click="openAddModal" data-args='[]'>Add</button>
      <button type="button" data-on-click="navigateTo" data-args='["index.html"]'>Back to ED Doc</button>
      <div class="forms-menu header-more">
        <button type="button" class="forms-menu-btn" aria-haspopup="true" aria-expanded="false" data-on-click="toggleFormsMenu" data-args='[{"event": true}]'><span>More</span> <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div class="forms-menu-list" role="menu">
          <button type="button" role="menuitem" class="header-reset" data-on-click="resetAllToBaseline" data-args='[]' title="Reset everything back to the default">Reset All</button>
        </div>
      </div>
      <button type="button" id="themeToggleBtn" class="btn-theme-toggle" data-on-click="toggleTheme" data-args='[]'><span>Day Mode</span></button>
    </div>
  </header>

  <div class="te-toolbar">
    <input type="search" id="searchInput" class="te-search" aria-label="Search parameters" placeholder="Search parameters, buttons or IDs" autocomplete="off" spellcheck="false" data-on-input="renderBoard" data-args='[]'>
    <div class="te-segments" role="group" aria-label="Filter by input type">
      <button type="button" data-filter="all" aria-pressed="true" data-on-click="setTypeFilter" data-args='["all"]'>All</button>
      <button type="button" data-filter="chips" aria-pressed="false" data-on-click="setTypeFilter" data-args='["chips"]'>With buttons</button>
      <button type="button" data-filter="text" aria-pressed="false" data-on-click="setTypeFilter" data-args='["text"]'>Text only</button>
    </div>
    <span class="te-counts" id="teCounts" aria-live="polite"></span>
  </div>

  <div id="main-sections"></div>

  <section class="output-container" aria-label="Changes">
    <div id="docHeaderRow">
      <button type="button" id="noteToggle" aria-expanded="false" data-on-click="toggleNoteSheet" data-args='[]'>
        <span class="cb-note-title">Changes</span>
        <span id="noteStatus"></span>
        <svg class="cb-note-chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
    </div>
    <textarea id="diffOutput" aria-label="Your changes" readonly></textarea>
    <div class="button-row">
      <button type="button" id="shareSetupBtn" class="btn-primary" data-on-click="shareSetup" data-args='[]'>Share setup</button>
      <button type="button" data-on-click="chooseSetupFile" data-args='[]'>Load setup</button>
      <button type="button" id="copyPromptBtn" data-on-click="copyPromptToClipboard" data-args='[]'>Copy for AI</button>
      <button type="button" data-on-click="downloadTemplatesFile" data-args='[]'>Download templates file</button>
      <input type="file" id="setupFile" accept="application/json,.json" hidden data-on-change="loadSetupFile" data-args='[{"this": true}]'>
    </div>
  </section>

  <!-- Add dialog: parameters, or a new submenu with its parameters -->
  <div id="addModal" class="modal-backdrop">
    <form id="addForm" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="addTitle">
      <div class="modal-header" id="addTitle">Add</div>
      <div class="modal-body">
        <div class="modal-pair">
          <div>
            <label for="addSection">Section</label>
            <select id="addSection" data-on-change="syncAddSubmenus" data-args='[]'></select>
          </div>
          <div id="addSubmenuWrap">
            <label for="addSubmenu">Submenu</label>
            <select id="addSubmenu" data-on-change="syncAddNewSubmenu" data-args='[]'></select>
          </div>
        </div>
        <div id="addNewSubmenuWrap" hidden>
          <label for="addNewSubmenu">New submenu name</label>
          <input type="text" id="addNewSubmenu" autocomplete="off" placeholder="e.g., Chest Pain">
        </div>
        <label for="addLines">Parameters, one per line</label>
        <textarea id="addLines" autocomplete="off" spellcheck="false" aria-describedby="addLinesHint" placeholder="Duration | 1 day, 2 days, 3 days, 1 week&#10;Severity | Mild, Moderate, Severe&#10;Remarks"></textarea>
        <p class="modal-hint" id="addLinesHint">Put buttons after a | and separate them with commas. A line with no | is a plain text box.</p>
        <label class="modal-check"><input type="checkbox" id="addMulti"> Let these parameters pick several buttons at once</label>
        <p class="modal-error" id="addError" role="alert"></p>
      </div>
      <div class="modal-footer">
        <button type="button" data-on-click="closeAddModal" data-args='[]'>Cancel</button>
        <button type="submit" class="btn-primary">Add</button>
      </div>
    </form>
  </div>

  <!-- Edit one button -->
  <div id="chipModal" class="modal-backdrop">
    <form id="chipForm" class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="chipTitle">
      <div class="modal-header" id="chipTitle">Button</div>
      <div class="modal-body">
        <label for="chipLabel">Button text</label>
        <input type="text" id="chipLabel" autocomplete="off" spellcheck="false">
        <label for="chipOutput">Writes in the note</label>
        <input type="text" id="chipOutput" autocomplete="off" spellcheck="false" placeholder="Same as the button text" aria-describedby="chipOutputHint">
        <p class="modal-hint" id="chipOutputHint">e.g. a button "HTN" can write "Hypertension".</p>
        <div class="modal-row">
          <button type="button" id="chipEarlier" data-on-click="moveChip" data-args='[-1]'>Move earlier</button>
          <button type="button" id="chipLater" data-on-click="moveChip" data-args='[1]'>Move later</button>
          <button type="button" class="is-danger" data-on-click="deleteChip" data-args='[]'>Delete button</button>
        </div>
        <p class="modal-error" id="chipError" role="alert"></p>
      </div>
      <div class="modal-footer">
        <button type="button" data-on-click="closeChipModal" data-args='[]'>Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="./assets/clinical_templates.js"></script>
  <script src="./assets/js/00-events.js"></script>
  <script src="./assets/js/00-schema-overrides.js"></script>
  <script src="./assets/js/14-forms-menu.js"></script>
  <script src="./assets/js/schema-editor.js"></script>

</body>

</html>
